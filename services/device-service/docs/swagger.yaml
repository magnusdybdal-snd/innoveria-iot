basePath: /api/v1/device
definitions:
  dto.CreateCompanyConfigRequest:
    properties:
      company_id:
        type: string
      name:
        type: string
    type: object
  dto.CreateCompanyConfigResponse:
    properties:
      tenant_id:
        type: string
    type: object
  dto.CreateGatewayRequest:
    properties:
      company_id:
        type: string
      description:
        type: string
      factory_area_id:
        type: string
      factory_id:
        type: string
      gateway_eui:
        type: string
      name:
        type: string
    required:
    - company_id
    - factory_area_id
    - factory_id
    - gateway_eui
    - name
    type: object
  dto.CreateMeasurementTypeRequest:
    properties:
      default_unit:
        type: string
      description:
        type: string
      display_name:
        type: string
      slug:
        type: string
    required:
    - display_name
    - slug
    type: object
  dto.CreateSensorRequest:
    properties:
      app_key:
        type: string
      company_id:
        description: 'TODO: CompanyID should be extracted from auth'
        type: string
      description:
        type: string
      device_eui:
        type: string
      device_profile_id:
        type: string
      factory_area_id:
        type: string
      factory_id:
        type: string
      name:
        type: string
      production_resource:
        description: Optional — UUID, omit if service not yet available
        type: string
    required:
    - app_key
    - company_id
    - device_eui
    - device_profile_id
    - factory_area_id
    - factory_id
    - name
    type: object
  dto.DiscoverPayloadKeysRequest:
    properties:
      payload_keys:
        items:
          type: string
        type: array
    required:
    - payload_keys
    type: object
  dto.DraftProfilesResponse:
    properties:
      profile_ids:
        items:
          type: string
        type: array
      total_count:
        type: integer
    type: object
  dto.GatewayListResponse:
    properties:
      gateways:
        items:
          $ref: '#/definitions/dto.GatewayResponse'
        type: array
      total_count:
        type: integer
    type: object
  dto.GatewayResponse:
    properties:
      company_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      factory_area_id:
        type: string
      factory_id:
        type: string
      gateway_eui:
        type: string
      id:
        type: string
      last_seen_at:
        type: string
      name:
        type: string
      state:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  dto.MeasurementTypeListResponse:
    properties:
      measurement_types:
        items:
          $ref: '#/definitions/dto.MeasurementTypeResponse'
        type: array
      total_count:
        type: integer
    type: object
  dto.MeasurementTypeResponse:
    properties:
      default_unit:
        type: string
      deprecated:
        type: boolean
      description:
        type: string
      display_name:
        type: string
      slug:
        type: string
    type: object
  dto.PayloadSchemaLabelRequest:
    properties:
      measurement_type:
        type: string
      payload_key:
        type: string
      unit:
        type: string
    required:
    - measurement_type
    - payload_key
    type: object
  dto.PayloadSchemaListResponse:
    properties:
      schemas:
        items:
          $ref: '#/definitions/dto.PayloadSchemaResponse'
        type: array
      total_count:
        type: integer
    type: object
  dto.PayloadSchemaResponse:
    properties:
      chirpstack_profile_id:
        type: string
      id:
        type: string
      measurement_type:
        type: string
      payload_key:
        type: string
      unit:
        type: string
    type: object
  dto.PutSensorProfileConfigRequest:
    properties:
      configurable_schema:
        type: boolean
    type: object
  dto.SampleEUIResponse:
    properties:
      device_eui:
        type: string
    type: object
  dto.SavePayloadSchemaLabelsRequest:
    properties:
      labels:
        items:
          $ref: '#/definitions/dto.PayloadSchemaLabelRequest'
        type: array
    required:
    - labels
    type: object
  dto.SensorListResponse:
    properties:
      sensors:
        items:
          $ref: '#/definitions/dto.SensorResponse'
        type: array
      total_count:
        type: integer
    type: object
  dto.SensorMetricListResponse:
    properties:
      metrics:
        items:
          $ref: '#/definitions/dto.SensorMetricResponse'
        type: array
      total_count:
        type: integer
    type: object
  dto.SensorMetricRequest:
    properties:
      measurement_type:
        type: string
      payload_key:
        type: string
      unit:
        type: string
    required:
    - measurement_type
    - payload_key
    type: object
  dto.SensorMetricResponse:
    properties:
      measurement_type:
        type: string
      payload_key:
        type: string
      unit:
        type: string
    type: object
  dto.SensorProfileConfigResponse:
    properties:
      chirpstack_profile_id:
        type: string
      configurable_schema:
        type: boolean
    type: object
  dto.SensorProfileListResponse:
    properties:
      sensor_profiles:
        items:
          $ref: '#/definitions/dto.SensorProfileResponse'
        type: array
      total_count:
        type: integer
    type: object
  dto.SensorProfileResponse:
    properties:
      id:
        type: string
      mac_version:
        description: LoRaWAN version
        type: string
      name:
        type: string
      region:
        description: LoRaWAN region (EU868)
        type: string
      vendor_id:
        description: Identification of model producer
        type: string
      vendor_name:
        description: Vendor name
        type: string
    type: object
  dto.SensorResponse:
    properties:
      app_key:
        type: string
      company_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      device_eui:
        type: string
      device_profile_id:
        type: string
      factory_area_id:
        type: string
      factory_id:
        type: string
      id:
        type: string
      last_seen_at:
        type: string
      name:
        type: string
      production_resource:
        type: string
      state:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  dto.UpdateGatewayRequest:
    properties:
      description:
        type: string
      factory_area_id:
        type: string
      factory_id:
        type: string
      name:
        type: string
    type: object
  dto.UpdateSensorRequest:
    properties:
      description:
        type: string
      device_profile_id:
        type: string
      factory_area_id:
        description: Optional — UUID, omit if service not yet available
        type: string
      factory_id:
        type: string
      name:
        type: string
      production_resource:
        description: Optional — UUID, omit if service not yet available
        type: string
    type: object
  dto.UpsertSensorMetricsRequest:
    properties:
      metrics:
        items:
          $ref: '#/definitions/dto.SensorMetricRequest'
        type: array
    required:
    - metrics
    type: object
host: localhost:8083
info:
  contact: {}
  description: Manages sensors, gateways, sensor profiles and sensor groups.
  title: Device Service API
  version: "1.0"
paths:
  /company-config:
    post:
      consumes:
      - application/json
      parameters:
      - description: Company config payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCompanyConfigRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateCompanyConfigResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create company config
      tags:
      - company-config
  /company-config/{companyID}:
    delete:
      parameters:
      - description: Company ID
        in: path
        name: companyID
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete company config
      tags:
      - company-config
  /gateways:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GatewayListResponse'
        "500":
          description: Internal Server Error
      summary: List all gateways
      tags:
      - gateways
    post:
      consumes:
      - application/json
      parameters:
      - description: Gateway payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateGatewayRequest'
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a gateway
      tags:
      - gateways
  /gateways/{id}:
    delete:
      parameters:
      - description: Gateway ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete a gateway
      tags:
      - gateways
    patch:
      consumes:
      - application/json
      parameters:
      - description: Gateway ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateGatewayRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update a gateway
      tags:
      - gateways
  /measurement-types:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeasurementTypeListResponse'
        "500":
          description: Internal Server Error
      summary: List active measurement types
      tags:
      - measurement-types
    post:
      consumes:
      - application/json
      parameters:
      - description: Measurement type payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMeasurementTypeRequest'
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
        "409":
          description: Conflict
        "500":
          description: Internal Server Error
      summary: Create a measurement type
      tags:
      - measurement-types
  /measurement-types/{slug}/deprecate:
    patch:
      parameters:
      - description: Measurement type slug
        in: path
        name: slug
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Deprecate a measurement type
      tags:
      - measurement-types
  /measurement-types/all:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeasurementTypeListResponse'
        "500":
          description: Internal Server Error
      summary: List all measurement types including deprecated
      tags:
      - measurement-types
  /payload-schema/{chirpstack_profile_id}:
    get:
      parameters:
      - description: ChirpStack profile ID
        in: path
        name: chirpstack_profile_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PayloadSchemaListResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Get payload schema for a profile
      tags:
      - payload-schema
    put:
      consumes:
      - application/json
      parameters:
      - description: ChirpStack profile ID
        in: path
        name: chirpstack_profile_id
        required: true
        type: string
      - description: Labels to save
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SavePayloadSchemaLabelsRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "422":
          description: Unprocessable Entity
        "500":
          description: Internal Server Error
      summary: Save payload schema labels for a profile
      tags:
      - payload-schema
  /payload-schema/{chirpstack_profile_id}/discover:
    post:
      consumes:
      - application/json
      parameters:
      - description: ChirpStack profile ID
        in: path
        name: chirpstack_profile_id
        required: true
        type: string
      - description: Discovered payload keys
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.DiscoverPayloadKeysRequest'
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Discover payload keys for a profile
      tags:
      - payload-schema
  /payload-schema/drafts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DraftProfilesResponse'
        "500":
          description: Internal Server Error
      summary: List profiles with unlabeled payload schema rows
      tags:
      - payload-schema
  /sensor-profile-config/{profile_id}:
    get:
      parameters:
      - description: Chirpstack profile ID
        in: path
        name: profile_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SensorProfileConfigResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Get sensor profile config
      tags:
      - sensor-profile-config
    put:
      consumes:
      - application/json
      parameters:
      - description: Chirpstack profile ID
        in: path
        name: profile_id
        required: true
        type: string
      - description: Sensor profile config payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PutSensorProfileConfigRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update sensor profile config
      tags:
      - sensor-profile-config
  /sensor-profiles:
    get:
      description: Not authenticated — every user can access this list.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SensorProfileListResponse'
        "500":
          description: Internal Server Error
      summary: List all sensor profiles
      tags:
      - sensor-profiles
  /sensors:
    get:
      parameters:
      - description: Production resource
        in: query
        name: production_resource_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SensorListResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Lists all sensors.
      tags:
      - sensors
    post:
      consumes:
      - application/json
      parameters:
      - description: Sensor payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateSensorRequest'
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a sensor
      tags:
      - sensors
  /sensors/{eui}/metrics:
    get:
      parameters:
      - description: Device EUI
        in: path
        name: eui
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SensorMetricListResponse'
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get effective metrics for a sensor
      tags:
      - sensor-metrics
    put:
      consumes:
      - application/json
      parameters:
      - description: Device EUI
        in: path
        name: eui
        required: true
        type: string
      - description: Metrics to save
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpsertSensorMetricsRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "422":
          description: Unprocessable Entity
        "500":
          description: Internal Server Error
      summary: Save metric labels for a sensor
      tags:
      - sensor-metrics
  /sensors/{id}:
    delete:
      parameters:
      - description: SensorID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete a sensor
      tags:
      - sensors
    patch:
      consumes:
      - application/json
      parameters:
      - description: Sensor ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateSensorRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update a sensor
      tags:
      - sensors
  /sensors/sample-eui:
    get:
      parameters:
      - description: Chirpstack profile ID
        in: query
        name: chirpstack_profile_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SampleEUIResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get a sample device EUI for a Chirpstack profile
      tags:
      - sensors
swagger: "2.0"
