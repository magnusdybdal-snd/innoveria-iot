basePath: /api/v1/device
definitions:
  dto.CreateCompanyConfigRequest:
    properties:
      company_id:
        type: string
      name:
        type: string
    type: object
  dto.CreateCompanyConfigResponse:
    properties:
      tenant_id:
        type: string
    type: object
  dto.CreateGatewayRequest:
    properties:
      company_id:
        type: string
      gateway_eui:
        type: string
      name:
        type: string
    required:
    - company_id
    - gateway_eui
    - name
    type: object
  dto.CreateSensorRequest:
    properties:
      app_key:
        type: string
      company_id:
        description: 'TODO: CompanyID should be extracted from auth'
        type: string
      description:
        type: string
      device_eui:
        type: string
      device_profile_id:
        type: string
      factory_area_id:
        description: Optional — UUID, omit if service not yet available
        type: string
      factory_id:
        type: string
      name:
        type: string
      production_resource:
        description: Optional — UUID, omit if service not yet available
        type: string
    required:
    - app_key
    - company_id
    - device_eui
    - device_profile_id
    - factory_id
    - name
    type: object
  dto.GatewayListResponse:
    properties:
      gateways:
        items:
          $ref: '#/definitions/dto.GatewayResponse'
        type: array
      total_count:
        type: integer
    type: object
  dto.GatewayResponse:
    properties:
      company_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      factory_area_id:
        type: string
      gateway_eui:
        type: string
      id:
        type: string
      last_seen_at:
        type: string
      name:
        type: string
      state:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  dto.SensorListResponse:
    properties:
      sensors:
        items:
          $ref: '#/definitions/dto.SensorResponse'
        type: array
      total_count:
        type: integer
    type: object
  dto.SensorProfileListResponse:
    properties:
      sensor_profiles:
        items:
          $ref: '#/definitions/dto.SensorProfileResponse'
        type: array
      total_count:
        type: integer
    type: object
  dto.SensorProfileResponse:
    properties:
      id:
        type: string
      mac_version:
        description: LoRaWAN version
        type: string
      name:
        type: string
      region:
        description: LoRaWAN region (EU868)
        type: string
      vendor_id:
        description: Identification of model producer
        type: string
      vendor_name:
        description: Vendor name
        type: string
    type: object
  dto.SensorResponse:
    properties:
      app_key:
        type: string
      company_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      device_eui:
        type: string
      device_profile_id:
        type: string
      factory_area_id:
        type: string
      factory_id:
        type: string
      id:
        type: string
      last_seen_at:
        type: string
      name:
        type: string
      production_resource:
        type: string
      state:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  dto.UpdateGatewayRequest:
    properties:
      description:
        type: string
      factory_area_id:
        type: string
      name:
        type: string
    type: object
  dto.UpdateSensorRequest:
    properties:
      description:
        type: string
      device_profile_id:
        type: string
      factory_area_id:
        description: Optional — UUID, omit if service not yet available
        type: string
      factory_id:
        type: string
      name:
        type: string
      production_resource:
        description: Optional — UUID, omit if service not yet available
        type: string
    type: object
host: localhost:8083
info:
  contact: {}
  description: Manages sensors, gateways, sensor profiles and sensor groups.
  title: Device Service API
  version: "1.0"
paths:
  /company-config:
    post:
      consumes:
      - application/json
      parameters:
      - description: Company config payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCompanyConfigRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateCompanyConfigResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create company config
      tags:
      - company-config
  /company-config/{companyID}:
    delete:
      parameters:
      - description: Company ID
        in: path
        name: companyID
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete company config
      tags:
      - company-config
  /gateways:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GatewayListResponse'
        "500":
          description: Internal Server Error
      summary: List all gateways
      tags:
      - gateways
    post:
      consumes:
      - application/json
      parameters:
      - description: Gateway payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateGatewayRequest'
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a gateway
      tags:
      - gateways
  /gateways/{id}:
    delete:
      parameters:
      - description: Gateway ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete a gateway
      tags:
      - gateways
    patch:
      consumes:
      - application/json
      parameters:
      - description: Gateway ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateGatewayRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update a gateway
      tags:
      - gateways
  /sensor-profiles:
    get:
      description: Not authenticated — every user can access this list.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SensorProfileListResponse'
        "500":
          description: Internal Server Error
      summary: List all sensor profiles
      tags:
      - sensor-profiles
  /sensors:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SensorListResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Lists all sensors.
      tags:
      - sensors
    post:
      consumes:
      - application/json
      parameters:
      - description: Sensor payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateSensorRequest'
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a sensor
      tags:
      - sensors
  /sensors/{id}:
    delete:
      parameters:
      - description: SensorID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete a sensor
      tags:
      - sensors
    patch:
      consumes:
      - application/json
      parameters:
      - description: Sensor ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateSensorRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update a sensor
      tags:
      - sensors
swagger: "2.0"
