basePath: /api/v1/auth
definitions:
  dto.CompanyListResponse:
    properties:
      companies:
        items:
          $ref: '#/definitions/dto.CompanyResponse'
        type: array
      total_count:
        type: integer
    type: object
  dto.CompanyResponse:
    properties:
      address:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  dto.CreateNewCompany:
    properties:
      address:
        type: string
      name:
        type: string
    type: object
  dto.CreateNewFactory:
    properties:
      address:
        type: string
      company_id:
        type: string
      name:
        type: string
    type: object
  dto.CreateNewFactoryArea:
    properties:
      description:
        type: string
      factory_id:
        type: string
      name:
        type: string
    type: object
  dto.CreateUserRequest:
    properties:
      company_id:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
  dto.FactoryAreaListResponse:
    properties:
      factory_areas:
        items:
          $ref: '#/definitions/dto.FactoryAreaResponse'
        type: array
      total_count:
        type: integer
    type: object
  dto.FactoryAreaResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      factory_id:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  dto.FactoryListResponse:
    properties:
      factories:
        items:
          $ref: '#/definitions/dto.FactoryResponse'
        type: array
      total_count:
        type: integer
    type: object
  dto.FactoryResponse:
    properties:
      address:
        type: string
      company_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.LoginResult:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
    type: object
  dto.MeResponse:
    properties:
      company_id:
        type: string
      email:
        type: string
      name:
        type: string
      role:
        type: string
      user_id:
        type: string
    type: object
  dto.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  dto.UserListResponse:
    properties:
      total_count:
        type: integer
      users:
        items:
          $ref: '#/definitions/dto.UserResponse'
        type: array
    type: object
  dto.UserResponse:
    properties:
      company_id:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_logged_in:
        type: string
      name:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8084
info:
  contact: {}
  description: Manages user authenticaion, permission roles, company generation
  title: Auth Service API
  version: "1.0"
paths:
  /companies:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CompanyListResponse'
        "500":
          description: Internal Server Error
      summary: Get all companies
      tags:
      - companies
    post:
      consumes:
      - application/json
      parameters:
      - description: Company payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateNewCompany'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CompanyResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Register a new company
      tags:
      - companies
  /companies/{id}:
    delete:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Delete company
      tags:
      - companies
    get:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CompanyResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get one company
      tags:
      - companies
  /factories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FactoryListResponse'
        "500":
          description: Internal Server Error
      summary: Get all factories
      tags:
      - factories
    post:
      consumes:
      - application/json
      parameters:
      - description: Factory payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateNewFactory'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.FactoryResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Register a new factory
      tags:
      - factories
  /factories/{id}:
    delete:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Delete factory
      tags:
      - factories
    get:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FactoryResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get one factory
      tags:
      - factories
  /factory-areas:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FactoryAreaListResponse'
        "500":
          description: Internal Server Error
      summary: Get all factory areas
      tags:
      - factory-areas
    post:
      consumes:
      - application/json
      parameters:
      - description: Factory area payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateNewFactoryArea'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.FactoryAreaResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Register a new factory area
      tags:
      - factory-areas
  /factory-areas/{id}:
    delete:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Delete factory area
      tags:
      - factory-areas
    get:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FactoryAreaResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get one factory area
      tags:
      - factory-areas
  /login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.LoginResult'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Login with email and password
      tags:
      - auth
  /me:
    get:
      description: Returns profile details for the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeResponse'
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      summary: Get current user profile
      tags:
      - auth
  /refresh:
    post:
      description: Validates the refresh_token cookie, rotates it, and returns a new
        access token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResult'
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      summary: Refresh access token
      tags:
      - auth
  /users:
    get:
      parameters:
      - description: Filter by company
        in: query
        name: company_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserListResponse'
        "403":
          description: Forbidden
        "500":
          description: Internal Server Error
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: User payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "409":
          description: Conflict
        "500":
          description: Internal Server Error
      summary: Create a user
      tags:
      - users
  /users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Delete a user
      tags:
      - users
    patch:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Update a user
      tags:
      - users
swagger: "2.0"
