basePath: /api/v1/context
definitions:
  dto.AggregationRuleResponse:
    properties:
      aggregation_method:
        type: string
      company_id:
        type: string
      context_type:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      measurement_type:
        type: string
      name:
        type: string
      time_bucket_minutes:
        type: integer
      updated_at:
        type: string
    type: object
  dto.BucketResponse:
    properties:
      period_end:
        type: string
      period_start:
        type: string
      value:
        type: number
    type: object
  dto.ContextDataResponse:
    properties:
      buckets:
        items:
          $ref: '#/definitions/dto.BucketResponse'
        type: array
      calculated_at:
        type: string
      company_id:
        type: string
      context_type:
        type: string
      device_eui:
        type: string
      period_end:
        type: string
      period_start:
        type: string
      total_value:
        type: number
      unit:
        type: string
    type: object
  dto.CreateAggregationRuleRequest:
    properties:
      aggregation_method:
        type: string
      company_id:
        type: string
      context_type:
        type: string
      is_active:
        type: boolean
      measurement_type:
        type: string
      name:
        type: string
      time_bucket_minutes:
        type: integer
    required:
    - aggregation_method
    - company_id
    - context_type
    - measurement_type
    - name
    - time_bucket_minutes
    type: object
host: localhost:8086
info:
  contact: {}
  description: Handles context management for sensor data
  title: Context Service API
  version: "1.0"
paths:
  /data:
    get:
      parameters:
      - description: Company ID
        in: query
        name: company_id
        required: true
        type: string
      - collectionFormat: multi
        description: Device EUI(s)
        in: query
        items:
          type: string
        name: device_eui
        required: true
        type: array
      - description: Aggregation Rule ID
        in: query
        name: rule_id
        required: true
        type: string
      - description: Period start (RFC3339)
        in: query
        name: from
        required: true
        type: string
      - description: Period end (RFC3339)
        in: query
        name: to
        required: true
        type: string
      - description: Bucket size in minutes (overrides rule default)
        in: query
        name: bucket_minutes
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ContextDataResponse'
            type: array
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get Context Data
      tags:
      - context
  /rules:
    get:
      parameters:
      - description: Company ID
        in: query
        name: company_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AggregationRuleResponse'
            type: array
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Get Aggregation Rules
      tags:
      - context
    post:
      consumes:
      - application/json
      parameters:
      - description: Aggregation Rule to create
        in: body
        name: rule
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAggregationRuleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
        "409":
          description: Conflict
        "500":
          description: Internal Server Error
      summary: Create Aggregation Rule
      tags:
      - context
  /rules/{rule_id}:
    delete:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Delete Aggregation Rule
      tags:
      - context
swagger: "2.0"
