# CI for Go services and shared pkg/
variables:
  # golangci-lint version must match the version in each service's go.mod
  GOLANGCI_LINT_VERSION: "v2.11.3"
  # pkg/ must be first — services depend on it via replace directive.
  GO_SERVICES: "pkg/ services/api-gateway services/collection-service services/device-service services/auth-service services/onboarding-service services/context-service"

go-check:
  stage: check
  tags:
    - dind
  image: golang:1.25
  before_script:
    # Install golangci-lint via official install script.
    # Uses a pre-built binary (~5s) instead of compiling from source.
    - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin $GOLANGCI_LINT_VERSION
  script:
    - |
      for dir in $GO_SERVICES; do
        echo "Tidying and linting $dir..."
        cd "$CI_PROJECT_DIR/$dir"
        go mod tidy
        golangci-lint run ./...
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# checks staged sql files for 'simple syntax errors'.
sql-check:
  stage: check
  tags:
    - dind
  image: oven/bun:1.3.9
  before_script:
    - cd web
    - bun install --frozen-lockfile
  script:
    - find "$CI_PROJECT_DIR" -name "*.sql" -exec ./node_modules/.bin/sql-lint --driver postgres {} \;
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

go-build:
  stage: build
  tags:
    - dind
  image: golang:1.25
  script:
    - |
      for dir in $GO_SERVICES; do
        echo "Building $dir..."
        cd "$CI_PROJECT_DIR/$dir"
        go build ./...
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

go-test:
  stage: test
  tags:
    - dind
  image: golang:1.25
  script:
    - |
      for dir in $GO_SERVICES; do
        echo "Testing $dir..."
        cd "$CI_PROJECT_DIR/$dir"
        go test ./...
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
